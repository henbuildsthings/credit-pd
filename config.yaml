# Project config. Decision bands etc. are added in later modules.
seed: 42

data:
  openml_data_id: 31 # credit-g; always fetched by pinned id, never by name
  target: class
  positive_label: bad

split: # stratified on data.target, seeded by seed
  fractions: # last split absorbs rounding
    train: 0.55
    val: 0.15
    test: 0.15
    future: 0.15 # never used in training

# Candidate models for `make train`: name -> constructor params. Each is wrapped in a
# Pipeline with the preprocessor and seeded from `seed`. The winner is picked by val AUC.
models:
  baseline: # DummyClassifier: predicts the training default rate for everyone
    strategy: prior
  logreg: # LogisticRegression
    max_iter: 1000
  gbm: # HistGradientBoostingClassifier
    max_iter: 200
    learning_rate: 0.05
    max_depth: 3

# Experiment tracking and model registry (local MLflow; the registry of record).
mlflow:
  tracking_uri: sqlite:///mlflow.db # relative paths resolve from the repo root
  artifact_dir: mlruns # where run artifacts and logged models are stored
  experiment_name: credit-pd
  registered_model_name: credit-pd

paths:
  raw: data/raw/credit-g.parquet
  splits: data/processed/splits.parquet
  manifest: data/manifest.json
